<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --tone: 187, 243, 81;
        --tone2: 0, 188, 255;
        --tint: 10, 12, 17;
        --text: #e9f2ec;
        --text2: #8b9aa6;
        --primary: #bbf351;
        --edge: 0.24;
        --radius: 10px;
        --mono: ui-monospace, 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
        min-height: 100vh;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
        color: var(--text);
        background:
            radial-gradient(1100px 700px at 10% -14%, rgba(187,243,81,0.10), transparent 58%),
            radial-gradient(900px 620px at 96% 2%, rgba(0,188,255,0.09), transparent 60%),
            #08090d;
        background-attachment: fixed;
        line-height: 1.6;
        padding: 56px 24px 72px;
        display: flex; justify-content: center;
    }

    .wrap { width: 100%; max-width: 880px; }

    nav.crumbs {
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--text2);
        margin-bottom: 20px;
        letter-spacing: 0.02em;
    }
    nav.crumbs a { color: var(--text2); text-decoration: none; }
    nav.crumbs a:hover { color: var(--primary); }
    nav.crumbs a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    nav.crumbs .sep { opacity: 0.45; margin: 0 6px; }
    nav.crumbs .here { color: var(--primary); }

    h1 {
        font-family: var(--mono);
        font-size: 1.35rem; font-weight: 600;
        color: var(--primary);
        text-shadow: 0 0 18px rgba(var(--tone), 0.55);
        margin-bottom: 6px;
        word-break: break-all;
    }
    .sub { color: var(--text2); font-size: 0.88rem; margin-bottom: 32px; }

    h2 {
        font-size: 0.78rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.12em;
        color: var(--text2);
        font-family: var(--mono);
        margin-bottom: 12px;
        display: flex; align-items: center; gap: 10px;
    }
    h2::after {
        content: ''; flex: 1; height: 1px;
        background: linear-gradient(90deg, rgba(var(--tone), 0.4), transparent);
    }

    .card {
        display: block; text-decoration: none; color: inherit;
        background: rgba(var(--tint), 0.90);
        border: 1px solid rgba(var(--tone), var(--edge));
        border-radius: var(--radius);
        padding: 18px 20px;
        box-shadow: 0 0 0 1px rgba(var(--tone), var(--edge)), 0 0 26px -16px rgba(var(--tone), 1);
        transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .card + .card { margin-top: 12px; }
    .card:hover {
        border-color: rgba(var(--tone), 0.55);
        box-shadow: 0 0 0 1px rgba(var(--tone), 0.55), 0 0 34px -12px rgba(var(--tone), 1);
        transform: translateY(-2px);
    }
    .card:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

    .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .card-name {
        font-family: var(--mono);
        font-size: 1rem; font-weight: 600; color: var(--primary);
        text-shadow: 0 0 14px rgba(var(--tone), 0.55);
        word-break: break-all;
    }
    .card-go { font-size: 0.8rem; color: var(--text2); white-space: nowrap; }
    .card:hover .card-go { color: var(--primary); }
    .card-desc { display: block; font-size: 0.85rem; color: var(--text2); margin-top: 6px; }

    footer {
        margin-top: 48px; padding-top: 20px;
        border-top: 1px solid rgba(var(--tone), 0.16);
        font-size: 0.78rem; color: var(--text2);
        display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    footer a { color: var(--text2); text-decoration: none; border-bottom: 1px solid rgba(var(--tone), 0.35); }
    footer a:hover { color: var(--primary); border-bottom-color: var(--primary); }
    footer a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
    @media (max-width: 560px) {
        body { padding: 36px 16px 48px; }
    }
</style>
