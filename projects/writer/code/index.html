<style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
        color-scheme: dark;
        --bg: #0f1115;
        --surface: rgba(15, 17, 21, 0.92);
        --text: #eceff4;
        --muted: #98a2b3;
        --accent: #e0a458;
        --edge: rgba(224, 164, 88, 0.28);
        --mono: ui-monospace, 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    }
    body {
        min-height: 100vh; margin: 0; padding: 48px 20px;
        color: var(--text);
        background: radial-gradient(900px 600px at 10% 0%, rgba(224,164,88,.09), transparent 60%), var(--bg);
        font: 16px/1.65 'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
    }
    main { width: min(100%, 820px); margin: auto; }
    nav { color: var(--muted); font-size: .85rem; margin-bottom: 28px; font-family: var(--mono); }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover, nav a:focus-visible { color: var(--accent); }
    h1 { margin: 0; color: var(--accent); font-size: clamp(1.7rem, 5vw, 2.6rem); font-family: var(--mono); }
    .sub { color: var(--muted); margin: 6px 0 24px; }
    .card {
        display: block; padding: 20px 22px; border: 1px solid var(--edge); border-radius: 12px;
        background: var(--surface); color: inherit; text-decoration: none;
        box-shadow: 0 0 26px -16px rgba(224,164,88,.8);
        transition: border-color .2s, transform .2s;
    }
    .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-2px); }
    .card strong { color: var(--accent); font-family: var(--mono); }
    .card p { color: var(--muted); margin: 6px 0 0; }
    footer {
        margin-top: 40px; padding-top: 16px; border-top: 1px solid rgba(224,164,88,.16);
        color: var(--muted); font-size: .78rem; text-align: center;
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    .card + .card { margin-top: 10px; }
    @media (max-width: 560px) { body { padding: 32px 16px; } .card { padding: 17px; } }
</style>
</head>
<body>
<main>
    <nav aria-label="面包屑导航"><a href="../">Writer</a> <span aria-hidden="true">/</span> <span>code</span></nav>

    </a>
