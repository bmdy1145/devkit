# PR 按路径自动打标签
#
# 用 pull_request_target 而不是 pull_request：来自 fork 的 PR 在 pull_request
# 事件下只能拿到只读令牌，打不上标签；pull_request_target 在 base 仓库上下文
# 运行，令牌可写。
#
# 安全说明：本工作流**不检出 PR 的代码**（checkout 默认取 base 分支），
# 只通过 API 读取改动文件列表，因此不存在执行不可信代码的问题。
# 这也是本仓库唯一使用 pull_request_target 的工作流，改动时务必保持这一点。
#
# 标签不存在时由脚本自动创建，无需事先在网页端手工建标签。

name: PR 自动打标签

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: 按路径打标签
    runs-on: ubuntu-latest
    steps:
      - name: 检出基础分支（不要改成 PR 的 head）
        uses: actions/checkout@v7
      - name: 打标签
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/label_pr.py
