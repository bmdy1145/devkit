# 构建多语言实现并上传到 Release
#
# 触发：
#   · 推送 touches implementations/ 的提交到 main —— 自动构建并发布
#   · 手动 workflow_dispatch —— 可指定标签后缀，便于重发
#
# 为什么用 windows-latest：Python 的 PyInstaller **不支持交叉编译**，
# 只能在 Windows 上打包 Windows EXE。其余五种语言在 Windows 上也能构建，
# 统一用同一个 runner 省去产物在 job 间传递的复杂度。
#
# 产物不进仓库：EXE 只作为 Release 附件存在，不占仓库容量。
# 仓库里只有源码，由本工作流负责编译。

name: 构建多语言实现

on:
  push:
    branches: [main]
    paths:
      - 'implementations/**'
      - '.github/workflows/build-implementations.yml'
  workflow_dispatch:
    inputs:
      suffix:
        description: '可选标签后缀。留空则自动递增，例如填 2 得到 implementations.2'
        required: false
        type: string

permissions:
  contents: write

# 与发布工作流分开串行化，避免两次构建同时抢同一个标签号
concurrency:
  group: build-implementations
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建并发布多语言产物
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # ---------- 工具链 ----------
      # 版本与本地验证时一致，避免"本地能编译、CI 编不过"

      - name: 安装 Rust（GNU 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/**/target
          key: cargo-${{ runner.os }}-${{ hashFiles('implementations/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: implementations/**/go.sum

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 安装 MinGW（供 Rust GNU 目标与 C++ 使用）
        shell: pwsh
        run: |
          # MSYS2 自带 mingw-w64，比 w64devkit 更适合 CI（无需自解压）
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ---------- 构建 ----------
      # ---------- 构建 ----------
      #
      # 下面每一步都**遍历 implementations 下的全部项目目录**，而不是只认
      # dircleaner。原因：四个项目（devkit / submerge-pro / dircleaner /
      # writer）各有 core 与 full 两层，共 48 个产物。若写死某个项目名，
      # 其余项目的实现永远不会被构建，Release 里也只有一小部分产物。
      #
      # 判定方式统一为「该子目录下有没有该语言的标志文件」：
      #   Rust → Cargo.toml、Go → go.mod、C++ → main.cpp
      #   C# → *.csproj、Python → *.py
      # 这样新增项目时无需再改本文件。

      - name: 构建 Rust（core + full，全部项目）
        shell: pwsh
        run: |
          # 不需要 RUSTFLAGS：CI runner 的默认目标是 MSVC，链接器自带 CRT。
          # `-C link-self-contained` 只对 GNU 目标有效，在 MSVC 上会被 rustc
          # 直接拒收（"option `-C link-self-contained` is not supported on
          # this target"），这是本工作流首次运行失败的原因。
          $fail = @()
          Get-ChildItem implementations -Directory -Filter "rust-*" | ForEach-Object {
            Get-ChildItem $_.FullName -Directory | ForEach-Object {
              $dir = $_.FullName
              if (Test-Path "$dir/Cargo.toml") {
                Write-Host "::group::cargo build $dir"
                Push-Location $dir
                cargo build --release
                if ($LASTEXITCODE -ne 0) { $fail += $dir }
                Pop-Location
                Write-Host "::endgroup::"
              }
            }
          }
          if ($fail.Count -gt 0) { Write-Error "Rust 构建失败：$($fail -join ', ')"; exit 1 }

      - name: 构建 Go（core + full，全部项目）
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          $env:GOPROXY = "https://proxy.golang.org,direct"
          $fail = @()
          Get-ChildItem implementations -Directory -Filter "go-*" | ForEach-Object {
            $layer = $_.Name   # go-core / go-full
            Get-ChildItem $_.FullName -Directory | ForEach-Object {
              $dir = $_.FullName
              if (Test-Path "$dir/go.mod") {
                Write-Host "::group::go build $dir"
                Push-Location $dir
                go mod tidy
                if ($layer -eq "go-full") {
                  go build -ldflags="-H windowsgui" -o "$($_.Name)-gui.exe" .
                } else {
                  go build -o "$($_.Name).exe" .
                }
                if ($LASTEXITCODE -ne 0) { $fail += $dir }
                Pop-Location
                Write-Host "::endgroup::"
              }
            }
          }
          if ($fail.Count -gt 0) { Write-Error "Go 构建失败：$($fail -join ', ')"; exit 1 }

      - name: 构建 C++（core + full，全部项目）
        shell: pwsh
        run: |
          $fail = @()
          Get-ChildItem implementations -Directory -Filter "cpp-*" | ForEach-Object {
            $layer = $_.Name
            Get-ChildItem $_.FullName -Directory | ForEach-Object {
              $dir = $_.FullName
              if (Test-Path "$dir/main.cpp") {
                Write-Host "::group::g++ $dir"
                Push-Location $dir
                if ($layer -eq "cpp-full") {
                  g++ -std=c++17 -O2 -static -mwindows -o "$($_.Name)-gui.exe" main.cpp -lcomctl32 -lole32 -lshell32
                } else {
                  g++ -std=c++17 -O2 -static -o "$($_.Name).exe" main.cpp
                }
                if ($LASTEXITCODE -ne 0) { $fail += $dir }
                Pop-Location
                Write-Host "::endgroup::"
              }
            }
          }
          if ($fail.Count -gt 0) { Write-Error "C++ 构建失败：$($fail -join ', ')"; exit 1 }

      - name: 构建 C#（core + full，全部项目）
        shell: pwsh
        run: |
          $fail = @()
          Get-ChildItem implementations -Directory -Filter "csharp-*" | ForEach-Object {
            Get-ChildItem $_.FullName -Directory | ForEach-Object {
              $dir = $_.FullName
              $proj = Get-ChildItem $dir -Filter "*.csproj" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($proj) {
                Write-Host "::group::dotnet publish $dir"
                Push-Location $dir
                dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
                if ($LASTEXITCODE -ne 0) { $fail += $dir }
                Pop-Location
                Write-Host "::endgroup::"
              }
            }
          }
          if ($fail.Count -gt 0) { Write-Error "C# 构建失败：$($fail -join ', ')"; exit 1 }

      - name: 构建 Python（core + full，全部项目）
        shell: pwsh
        run: |
          $fail = @()
          Get-ChildItem implementations -Directory -Filter "python-*" | ForEach-Object {
            $layer = $_.Name
            Get-ChildItem $_.FullName -Directory | ForEach-Object {
              $dir = $_.FullName
              $files = Get-ChildItem $dir -Filter "*.py" -ErrorAction SilentlyContinue
              if (-not $files) { return }
              # full 层优先找 *_gui.py，core 层找同名 .py
              $entry = if ($layer -eq "python-full") {
                $files | Where-Object { $_.Name -like "*_gui.py" } | Select-Object -First 1
              } else {
                $files | Where-Object { $_.Name -notlike "*_gui.py" } | Select-Object -First 1
              }
              if (-not $entry) { return }
              Write-Host "::group::pyinstaller $dir"
              Push-Location $dir
              if ($layer -eq "python-full") {
                python -m PyInstaller --onefile --windowed --noconfirm --name "$($_.Name)-gui" --distpath dist --workpath build --specpath spec $entry.Name
              } else {
                python -m PyInstaller --onefile --console --noconfirm --name "$($_.Name)" --distpath dist --workpath build --specpath spec $entry.Name
              }
              if ($LASTEXITCODE -ne 0) { $fail += $dir }
              Pop-Location
              Write-Host "::endgroup::"
            }
          }
          if ($fail.Count -gt 0) { Write-Error "Python 构建失败：$($fail -join ', ')"; exit 1 }

      - name: 构建 TypeScript（core + full）
        shell: pwsh
        run: |
          # Node 无原生 EXE 打包（SEA 需额外注入 blob），当前交付 .js 源码。
          # 这里只做语法检查，确保产物可运行；真正的 EXE 打包留待后续迭代。
          $fail = @()
          Get-ChildItem implementations -Directory -Filter "typescript-*" | ForEach-Object {
            Get-ChildItem $_.FullName -Directory | ForEach-Object {
              $dir = $_.FullName
              Get-ChildItem $dir -Filter "*.js" -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "::group::node --check $($_.FullName)"
                node --check $_.FullName
                if ($LASTEXITCODE -ne 0) { $fail += $_.FullName }
                Write-Host "::endgroup::"
              }
            }
          }
          if ($fail.Count -gt 0) { Write-Error "TypeScript 语法检查失败：$($fail -join ', ')"; exit 1 }

      # ---------- 汇总产物 ----------
      - name: 收集产物
        shell: pwsh
        run: |
          # 按目录扫描，而不是写死文件清单：任何新加的项目/语言自动被收集。
          # 命名规则：<语言层>__<项目>[-gui].exe，例如 rust-full__writer-gui.exe
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $map = @{
            "rust-core"   = @{ Proj = "target/release";  Suffix = "" }
            "rust-full"   = @{ Proj = "target/release";  Suffix = "-gui" }
            "go-core"     = @{ Proj = "";                Suffix = "" }
            "go-full"     = @{ Proj = "";                Suffix = "-gui" }
            "cpp-core"    = @{ Proj = "";                Suffix = "" }
            "cpp-full"    = @{ Proj = "";                Suffix = "-gui" }
            "csharp-core" = @{ Proj = "publish";         Suffix = "" }
            "csharp-full" = @{ Proj = "publish";         Suffix = "-gui" }
            "python-core" = @{ Proj = "dist";            Suffix = "" }
            "python-full" = @{ Proj = "dist";            Suffix = "-gui" }
          }

          $count = 0
          foreach ($layer in $map.Keys) {
            $layerDir = "implementations/$layer"
            if (-not (Test-Path $layerDir)) { continue }
            Get-ChildItem $layerDir -Directory | ForEach-Object {
              $proj = $_.Name
              $searchDir = if ($map[$layer].Proj) { Join-Path $_.FullName $map[$layer].Proj } else { $_.FullName }
              if (-not (Test-Path $searchDir)) { return }
              $suffix = $map[$layer].Suffix
              $exe = Get-ChildItem $searchDir -Filter "*.exe" -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -like "*$suffix.exe" } |
                     Sort-Object Length -Descending | Select-Object -First 1
              if ($exe) {
                $dst = "artifacts/${layer}__${proj}$suffix.exe"
                Copy-Item $exe.FullName $dst
                Write-Host "收集: $dst ← $($exe.FullName)"
                $count++
              } else {
                Write-Host "::warning::未找到 $layer/$proj 的产物（$searchDir）"
              }
            }
          }
          Write-Host "共收集 $count 个产物"
          if ($count -eq 0) { Write-Error "没有任何产物，检查构建步骤"; exit 1 }

      - name: 上传构建产物（工作流回执）
        uses: actions/upload-artifact@v4
        with:
          name: implementations-exe
          path: artifacts/*.exe
          if-no-files-found: warn

      # ---------- 发布 Release ----------
      - name: 计算标签并创建 Release
        if: hashFiles('artifacts/*.exe') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUFFIX: ${{ inputs.suffix }}
        run: |
          $tag = "implementations"
          if ($env:SUFFIX) {
            $tag = "implementations.$($env:SUFFIX)"
          } else {
            # 查已有标签，自动递增
            $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName }
            if ($existing -contains "implementations") {
              $nums = $existing | Where-Object { $_ -match '^implementations\.(\d+)$' } | ForEach-Object { [int]($_ -replace '^implementations\.','') }
              $next = if ($nums) { ($nums | Measure-Object -Maximum).Maximum + 1 } else { 1 }
              $tag = "implementations.$next"
            }
          }
          Write-Host "使用标签: $tag"
          $body = @"
          DevKit 多语言实现产物（自动构建）。

          由 ``.github/workflows/build-implementations.yml`` 在 windows-latest 上编译，
          源码位于仓库 ``implementations/``。EXE 不入库，仅作为本 Release 的附件。

          命名规则：``<语言>-<层次>__dircleaner.exe``
          · ``core`` = 纯逻辑内核（命令行）
          · ``full`` = 全功能版（图形界面）
          · 带 ``-gui`` 或 ``full`` 的是图形界面版
          "@
          gh release create $tag artifacts/*.exe --title $tag --notes $body
