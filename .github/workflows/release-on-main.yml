# main 一更新就自动发布（按项目分别发布）
#
# 每次推送到 main 都产生 Release，且**按项目分别判定**：
#   · 只给「本次推送真正改动到的项目 · 主干」发 Release
#   · 某项目只改了 code/ 下的索引页、没动主干，才给它最新主干发一个
#     「无功能更新」的 Release；DevKit 不会被 Writer 的提交牵连
#   · 标签命名：DevKit 沿用裸主干名（A1_V_Φ8、A1_V_Φ8.1……）；
#     其他项目加项目前缀（writer/A1_I_Φ2、writer/A1_I_Φ2.1……），避免
#     不同项目的 Φ 号相撞（dircleaner 与 submerge-pro 都从 Φ 号命名）
#
# 另有手动触发入口（workflow_dispatch）：填项目名 + 主干名即可补发一个 Release，
# 用于自动发布覆盖不到的情况——已冻结的老主干不会再被推送碰到，等不到自动发布。
#
# 编排逻辑在 .github/scripts/auto_release.py，发布说明在
# .github/scripts/make_release_notes.py，两个脚本本地都能独立运行。
#
# 标签保护提示：若日后给标签加 Rules 规则集，**不要勾「限制创建」**，
# 否则 Actions 的机器人令牌建不了标签，表现为「推送 main 后没有发布」且
# 报错不明显。只勾「限制删除」与「阻止强制推送」即可。

name: 自动发布

on:
  push:
    branches: [main]
  # 手动补发：自动发布只覆盖「本次推送改到的主干」，已冻结、不会再被推送碰到的
  # 老主干（例如 A1_V_Φ7）永远等不到发布。这里给一个手动入口补这个缺口。
  workflow_dispatch:
    inputs:
      project:
        description: '项目名（projects/ 下的目录名，例如 devkit、writer）'
        required: false
        default: 'devkit'
        type: string
      trunk:
        description: '主干名（须与 projects/<项目>/code/ 下的目录同名，例如 A1_V_Φ7）'
        required: true
        type: string
      suffix:
        description: '可选标签后缀。同一主干再次发布时填，例如填 1 得到 A1_V_Φ7.1；首次发布留空'
        required: false
        type: string

permissions:
  contents: write

# 串行化：两次推送若同时跑，可能算出同一个下一个标签号，互相覆盖
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: 建标签并创建 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 运行发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          # 手动触发时才有值；推送触发时为空，走「自动识别改动项目与主干」那条路
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_TRUNK: ${{ inputs.trunk }}
          DISPATCH_SUFFIX: ${{ inputs.suffix }}
        run: python3 .github/scripts/auto_release.py
