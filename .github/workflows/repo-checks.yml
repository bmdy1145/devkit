# 仓库体检
#
# 多个互不依赖的检查合在一个工作流里，各自是独立 job、并行执行，
# 失败时能一眼看出是哪一类问题：
#   · 相对链接   link_check.py  —— HTML/Markdown 里的链接是否指向存在的文件
#   · 文件体积   size_guard.py  —— 单文件是否异常膨胀
#   · 运行时冒烟 smoke_test.py  —— 无头浏览器打开每个版本文件，控制台无报错
#   · 发布逻辑   test_release_planning.py —— 「改哪个项目发哪个项目的标签」
#     这条规则的单元测试。它不依赖网络与浏览器，跑得很快。
#   · 测试工具   test_devkit_logic_helpers.py —— devkit_logic_test 里纯辅助函数
#     （如按文件名推导版本号）的单测，同样不依赖浏览器。
#   · DevKit 行为 devkit_logic_test.py —— 经 #selftest 测试缝断言提示词拼装、
#     版本解析、设置归一化与关键交互（主线无测试缝时脚本自报跳过）。
#   · 人设逻辑   snapshot_other_test.py —— Persona 快照字段存取、恢复、
#     记忆范围切换的运行时断言。冒烟只查控制台报错，抓不到「启动之后才抛」
#     的缺陷（这类异常不留 CONSOLE 行），所以那类逻辑需要真正跑一遍流程。
#   · 分享图     share_image_test.py —— 比例/分辨率映射、换行、分页、单张
#     适配这些纯函数，以及真实画布输出的尺寸与像素采样。
#   · 起始提示词 start_prompt_test.py —— 与人设/世界观相关的 12 个「类型 ×
#     场景」提示词组合、模式切换文案、向上展开菜单的位置。
#   · 测试版体系 test_test_version_system.py —— 生成清单自洽、各项目
#     命名差异（_CN 后缀 / CURRENT_VERSION 有无）、自检项数映射。
#   · 测试版结构 test_guard.py + build_test_version.py --check ——
#     文件名/版本代号/CURRENT_VERSION 一致、清单与磁盘双向对齐、
#     HTML 骨架闭合、副本无漂移。
#   · 内置自检实测 test_selftest_runner.py —— 无头 Chrome 里打开每个
#     测试版跑一遍自检，逐项读 PASS / FAIL。自检脚本写坏时其它守卫全绿。
#
# 与 version-guard 一样默认只报告、不拦截。
# 每个脚本本地都能用同一条命令运行。

name: 仓库体检

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: 相对链接
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 运行链接检查
        run: python3 .github/scripts/link_check.py

  size-guard:
    name: 文件体积
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 运行体积检查
        run: python3 .github/scripts/size_guard.py

  smoke-test:
    name: 运行时冒烟
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 运行冒烟测试
        run: python3 .github/scripts/smoke_test.py

  release-planning:
    name: 发布逻辑单测
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 运行单元测试
        run: |
          python3 .github/scripts/test_release_planning.py
          python3 .github/scripts/test_devkit_logic_helpers.py
          python3 .github/scripts/test_test_version_system.py

  persona-logic:
    name: 人设逻辑单测
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      # ubuntu-latest 的 runner 预装 google-chrome，脚本用 shutil.which 能找到；
      # 找不到时才需要 CHROME_BIN。
      - name: 运行人设逻辑单测
        run: python3 .github/scripts/snapshot_other_test.py
      - name: 运行分享图逻辑单测
        run: python3 .github/scripts/share_image_test.py
      - name: 运行起始提示词单测
        run: python3 .github/scripts/start_prompt_test.py

  devkit-logic:
    name: DevKit 行为单测
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      # 用真实浏览器加载产品文件的临时副本，经 #selftest 挂载的测试缝
      # 断言提示词拼装、版本解析、设置归一化与关键交互。
      - name: 运行 DevKit 行为单测
        run: python3 .github/scripts/devkit_logic_test.py

  test-version-guard:
    name: 测试版结构校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      # 测试版不归 version_guard 管（那只遍历 code/），由 test_guard 单独校验：
      # 文件名/版本代号/CURRENT_VERSION 一致、基线主干存在、必须带自检标记、
      # 正式版不得被注入，且生成清单与磁盘目录双向对齐。
      - name: 校验测试版结构
        run: python3 .github/scripts/test_guard.py
      - name: 校验测试版与正式版同步
        run: python3 .github/scripts/build_test_version.py --check
      # 自检脚本本身也要能跑通：用无头 Chrome 打开每个测试版、点自检、
      # 逐项读 PASS / FAIL。自检写坏了不会让任何其它守卫变红。
      - name: 实测内置自检
        run: python3 .github/scripts/test_selftest_runner.py
